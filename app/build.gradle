plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def backendBaseUrl = project.findProperty('SAATHI_BACKEND_BASE_URL') ?: "https://example-backend.invalid/"
def backendApiKey = project.findProperty('SAATHI_BACKEND_API_KEY') ?: ""

android {
    namespace 'com.saathi.assistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.saathi.assistant"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // NOTE: these are NOT LLM provider secrets. They only point the app at
        // the Saathi backend and carry an app<->backend access token. The real
        // OpenAI/Anthropic key lives only in the backend's environment and is
        // never compiled into the APK.
        buildConfigField "String", "BACKEND_BASE_URL", "\"${backendBaseUrl}\""
        buildConfigField "String", "BACKEND_API_KEY", "\"${backendApiKey}\""
    }

    buildTypes {
        debug {
            buildConfigField "String", "BACKEND_BASE_URL", "\"${project.findProperty('SAATHI_BACKEND_BASE_URL_DEBUG') ?: backendBaseUrl}\""
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Unit tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.8.0'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
